name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: check ${{ matrix.os }} node ${{ matrix.node }}
    strategy:
      # Both platforms, because the deletion engine is filesystem code: it walks directories, resolves
      # links and unlinks files, and the two families disagree about all three. Both Node majors,
      # because the package claims them and the isolation flag is spelled differently in each — the
      # spelling lives in scripts/test.mjs, chosen from the running version, so running `npm test` here
      # is also the check that the choice is right.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Every module parses
        run: |
          node --check index.js
          node --check engine.js
          node --check scripts/check.mjs
          node --check scripts/test.mjs

      - name: Fixture tests
        # The command a contributor runs, not a variant of it: scripts/test.mjs shares one process on
        # purpose and picks this major's spelling of the flag.
        run: npm test

      - name: Repository checks
        run: node scripts/check.mjs
