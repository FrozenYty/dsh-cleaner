name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      # Both platforms, because the deletion engine is filesystem code: it walks directories, resolves
      # links and unlinks files, and the two families disagree about all three. Both Node majors,
      # because the package claims them and the isolation flag is spelled differently in each.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24"
            isolation: "--test-isolation=none"
          - os: windows-latest
            node: "24"
            isolation: "--test-isolation=none"
          - os: ubuntu-latest
            node: "22"
            isolation: "--experimental-test-isolation=none"
          - os: windows-latest
            node: "22"
            isolation: "--experimental-test-isolation=none"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Every module parses
        run: |
          node --check index.js
          node --check engine.js
          node --check scripts/check.mjs

      - name: Fixture tests
        # One process on purpose, exactly as the README documents: the suites build their own trees under
        # tests/. Node 24 spells the flag `--test-isolation`, Node 22 `--experimental-test-isolation`; the
        # matrix carries the spelling, so a green run means the same thing here and on this machine.
        run: node --test ${{ matrix.isolation }} tests/*.test.mjs

      - name: Repository checks
        run: node scripts/check.mjs
